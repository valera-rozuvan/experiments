<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <script src="tailwindcss-3.4.17.js"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <!-- Explanation Modal -->
    <div id="explanationModal" class="fixed right-4 top-1/2 transform -translate-y-1/2 bg-white rounded-lg shadow-xl p-6 w-80 border-l-4 border-blue-500 hidden z-10">
        <div class="flex items-start justify-between mb-4">
            <h3 id="modalTitle" class="text-lg font-semibold text-gray-800"></h3>
            <button id="closeModal" class="text-gray-400 hover:text-gray-600 transition duration-200">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        <p id="modalContent" class="text-gray-600 text-sm leading-relaxed"></p>
    </div>

    <div class="bg-white rounded-lg shadow-lg p-8 w-full max-w-md">
        <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Registration Form</h2>
        
        <form class="space-y-6">
            <!-- Name Input -->
            <div>
                <label for="name" class="flex items-center text-sm font-medium text-gray-700 mb-2">
                    Full Name
                    <button type="button" class="ml-2 text-blue-500 hover:text-blue-700 transition duration-200" onclick="showExplanation('name')">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                    </button>
                </label>
                <input 
                    type="text" 
                    id="name" 
                    name="name"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-200"
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <!-- Email Input -->
            <div>
                <label for="email" class="flex items-center text-sm font-medium text-gray-700 mb-2">
                    Email Address
                    <button type="button" class="ml-2 text-blue-500 hover:text-blue-700 transition duration-200" onclick="showExplanation('email')">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                    </button>
                </label>
                <input 
                    type="email" 
                    id="email" 
                    name="email"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-200"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <!-- Password Input -->
            <div>
                <label for="password" class="flex items-center text-sm font-medium text-gray-700 mb-2">
                    Password
                    <button type="button" class="ml-2 text-blue-500 hover:text-blue-700 transition duration-200" onclick="showExplanation('password')">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                    </button>
                </label>
                <input 
                    type="password" 
                    id="password" 
                    name="password"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-200"
                    placeholder="Create a password"
                    required
                >
            </div>

            <!-- Key Type Dropdown -->
            <div>
                <label for="keyType" class="flex items-center text-sm font-medium text-gray-700 mb-2">
                    Key Type
                    <button type="button" class="ml-2 text-blue-500 hover:text-blue-700 transition duration-200" onclick="showExplanation('keyType')">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                    </button>
                </label>
                <select 
                    id="keyType" 
                    name="keyType"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-200 bg-white"
                    required
                >
                    <option value="">Select key type</option>
                    <option value="rsa">RSA</option>
                    <option value="ecdsa">ECDSA</option>
                    <option value="ed25519">Ed25519</option>
                    <option value="dsa">DSA</option>
                </select>
            </div>

            <!-- Curve Dropdown -->
            <div>
                <label for="curve" class="flex items-center text-sm font-medium text-gray-700 mb-2">
                    Curve
                    <button type="button" class="ml-2 text-blue-500 hover:text-blue-700 transition duration-200" onclick="showExplanation('curve')">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                    </button>
                </label>
                <select 
                    id="curve" 
                    name="curve"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-200 bg-white"
                    required
                >
                    <option value="">Select curve</option>
                    <option value="secp256r1">secp256r1 (P-256)</option>
                    <option value="secp384r1">secp384r1 (P-384)</option>
                    <option value="secp521r1">secp521r1 (P-521)</option>
                    <option value="curve25519">Curve25519</option>
                    <option value="secp256k1">secp256k1</option>
                </select>
            </div>

            <!-- Date Picker -->
            <div>
                <label class="flex items-center text-sm font-medium text-gray-700 mb-3">
                    Expiration Date
                    <button type="button" class="ml-2 text-blue-500 hover:text-blue-700 transition duration-200" onclick="showExplanation('date')">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                    </button>
                </label>
                
                <!-- Checkbox for "does not expire" -->
                <div class="mb-3">
                    <label class="flex items-center text-sm text-gray-600">
                        <input 
                            type="checkbox" 
                            id="noExpiration" 
                            name="noExpiration"
                            class="mr-2 h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded"
                            onchange="toggleDatePicker()"
                        >
                        Key does not expire
                    </label>
                </div>
                
                <!-- Date input (initially visible) -->
                <div id="datePickerContainer">
                    <input 
                        type="date" 
                        id="date" 
                        name="date"
                        class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-200"
                        required
                    >
                </div>
            </div>

            <!-- Submit Button -->
            <div class="pt-4">
                <button 
                    type="submit"
                    class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition duration-200 font-medium"
                >
                    Register
                </button>
            </div>
        </form>
    </div>

    <script>
        // Explanations for each form field
        const explanations = {
            name: {
                title: "Full Name",
                content: "Enter your complete legal name as it appears on official documents. This will be used for account identification and must match your government-issued ID for verification purposes."
            },
            email: {
                title: "Email Address",
                content: "Provide a valid email address that you have access to. This will be your primary method of communication and account recovery. You'll receive a verification email after registration."
            },
            password: {
                title: "Password",
                content: "Create a strong password with at least 8 characters, including uppercase and lowercase letters, numbers, and special characters. This password will secure your account and protect your cryptographic keys."
            },
            keyType: {
                title: "Cryptographic Key Type",
                content: "Select the type of cryptographic algorithm for your key pair. RSA is widely supported but slower, ECDSA offers good performance and security, Ed25519 provides excellent security with fast operations, and DSA is an older standard still used in some legacy systems."
            },
            curve: {
                title: "Elliptic Curve",
                content: "Choose the mathematical curve used for elliptic curve cryptography. P-256, P-384, and P-521 are NIST standard curves with different security levels. Curve25519 is a modern curve optimized for performance and security. secp256k1 is used by Bitcoin."
            },
            date: {
                title: "Key Expiration Date",
                content: "Set when your cryptographic key should expire. After this date, the key will no longer be valid for new operations. Choose a date that balances security (shorter is more secure) with convenience (longer reduces key rotation frequency). You can also choose to create a key that never expires, though this is less secure for long-term use."
            }
        };

        // Toggle date picker visibility based on checkbox
        function toggleDatePicker() {
            const checkbox = document.getElementById('noExpiration');
            const dateContainer = document.getElementById('datePickerContainer');
            const dateInput = document.getElementById('date');
            
            if (checkbox.checked) {
                // Hide date picker and remove required attribute
                dateContainer.style.display = 'none';
                dateInput.removeAttribute('required');
                dateInput.value = ''; // Clear any selected date
            } else {
                // Show date picker and add required attribute
                dateContainer.style.display = 'block';
                dateInput.setAttribute('required', 'required');
            }
        }

        // Show explanation modal
        function showExplanation(fieldId) {
            const modal = document.getElementById('explanationModal');
            const title = document.getElementById('modalTitle');
            const content = document.getElementById('modalContent');
            
            const explanation = explanations[fieldId];
            if (explanation) {
                title.textContent = explanation.title;
                content.textContent = explanation.content;
                modal.classList.remove('hidden');
            }
        }

        // Close modal functionality
        document.getElementById('closeModal').addEventListener('click', function() {
            document.getElementById('explanationModal').classList.add('hidden');
        });

        // Close modal when clicking outside
        document.addEventListener('click', function(e) {
            const modal = document.getElementById('explanationModal');
            const isQuestionButton = e.target.closest('button[onclick^="showExplanation"]');
            const isInsideModal = e.target.closest('#explanationModal');
            
            if (!isQuestionButton && !isInsideModal && !modal.classList.contains('hidden')) {
                modal.classList.add('hidden');
            }
        });

        // Form submission handler
        document.querySelector('form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Get form data
            const formData = new FormData(this);
            const data = Object.fromEntries(formData);
            
            // Display the form data (in a real app, you'd send this to a server)
            alert('Form submitted with data:\n' + JSON.stringify(data, null, 2));
        });

        // Dynamic curve options based on key type
        document.getElementById('keyType').addEventListener('change', function() {
            const curveSelect = document.getElementById('curve');
            const keyType = this.value;
            
            // Clear existing options
            curveSelect.innerHTML = '<option value="">Select curve</option>';
            
            let curves = [];
            switch(keyType) {
                case 'ecdsa':
                    curves = [
                        {value: 'secp256r1', text: 'secp256r1 (P-256)'},
                        {value: 'secp384r1', text: 'secp384r1 (P-384)'},
                        {value: 'secp521r1', text: 'secp521r1 (P-521)'},
                        {value: 'secp256k1', text: 'secp256k1'}
                    ];
                    break;
                case 'ed25519':
                    curves = [
                        {value: 'curve25519', text: 'Curve25519'}
                    ];
                    break;
                case 'rsa':
                case 'dsa':
                    curves = [
                        {value: 'na', text: 'Not applicable'}
                    ];
                    break;
            }
            
            curves.forEach(curve => {
                const option = document.createElement('option');
                option.value = curve.value;
                option.textContent = curve.text;
                curveSelect.appendChild(option);
            });
        });
    </script>
</body>
</html>
